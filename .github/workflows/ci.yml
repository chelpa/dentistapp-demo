name: DentistApp checks
# Pull-request checks: unit tests, types and the static export under the Pages sub-path.
# Originally uncle-feedback-ci.yml (PR #1/#2); renamed when the lines were integrated.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:static
        env:
          DENTISTAPP_BASE_PATH: /dentistapp-demo
          NEXT_TELEMETRY_DISABLED: "1"
